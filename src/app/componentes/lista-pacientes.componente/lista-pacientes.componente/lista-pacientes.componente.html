<div class="max-h-[600px] overflow-y-auto pr-4">
  @for (paciente of pacientes(); track paciente.id) {
    <div 
      (click)="onSeleccionar(paciente)" 
      class="bg-white border border-gray-300 rounded-md py-3 px-4 mb-3 text-center font-medium text-gray-800 hover:border-gray-400 cursor-pointer transition-colors shadow-sm">
      {{ paciente.nombre }} {{ paciente.apellidos }}
    </div>
  } 
  @empty {
    <div class="text-center p-8 text-gray-400 italic bg-white border border-dashed border-gray-300 rounded-md">
      No se han encontrado pacientes con esos filtros.
    </div>
  }
</div>
