<div class="h-full overflow-y-auto pr-2 custom-scrollbar">
  <div class="flex flex-col gap-3">
    @for (paciente of pacientes(); track paciente.id) {
      <div 
        (click)="onSeleccionar(paciente)" 
        class="bg-white border border-[#A64E2E] rounded-xl py-4 px-6 text-center font-bold text-[#592014] hover:bg-[#E5D1CD]/20 cursor-pointer transition-colors shadow-sm">
        {{ paciente.nombre }} {{ paciente.apellidos }}
      </div>
    } 
    @empty {
      <div class="text-center p-6 text-[#A64E2E] italic bg-white/50 border border-dashed border-[#A64E2E] rounded-xl">
        No se han encontrado pacientes.
      </div>
    }
  </div>
</div>
