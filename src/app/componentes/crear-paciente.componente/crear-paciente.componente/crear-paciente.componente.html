<div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm mx-4 relative border border-[#A64E2E] max-h-[90vh] overflow-y-auto custom-scrollbar">
  <h2 class="text-2xl font-bold text-[#592014] mb-6">Nuevo Paciente</h2>
  <form [formGroup]="pacienteForm" (ngSubmit)="onGuardar()" class="flex flex-col gap-5">
    <div>
      <label class="block text-[#A64E2E] font-bold mb-2 text-sm">Nombre</label>
      <input type="text" formControlName="nombre" class="w-full bg-gray-50 border border-[#A64E2E]/50 rounded-xl p-3 text-base text-[#592014] focus:ring-2 focus:ring-[#E5D1CD] focus:outline-none transition-all">
    </div>
    <div>
      <label class="block text-[#A64E2E] font-bold mb-2 text-sm">Apellidos</label>
      <input type="text" formControlName="apellidos" class="w-full bg-gray-50 border border-[#A64E2E]/50 rounded-xl p-3 text-base text-[#592014] focus:ring-2 focus:ring-[#E5D1CD] focus:outline-none transition-all">
    </div>
    <div>
      <label class="block text-[#A64E2E] font-bold mb-2 text-sm">Nivel de Riesgo</label>
      <select formControlName="riesgo" class="w-full bg-gray-50 border border-[#A64E2E]/50 rounded-xl p-3 text-base text-[#592014] focus:ring-2 focus:ring-[#E5D1CD] focus:outline-none transition-all appearance-none">
        <option value="" disabled>Seleccione nivel...</option>
        <option value="bajo">Bajo</option>
        <option value="medio">Medio</option>
        <option value="alto">Alto</option>
      </select>
    </div>
    <div>
      <label class="block text-[#A64E2E] font-bold mb-2 text-sm">Discapacidad</label>
      <select formControlName="discapacidad" class="w-full bg-gray-50 border border-[#A64E2E]/50 rounded-xl p-3 text-base text-[#592014] focus:ring-2 focus:ring-[#E5D1CD] focus:outline-none transition-all appearance-none">
        <option value="ninguna">Ninguna</option>
        <option value="fisica">Física</option>
        <option value="intelectual">Intelectual</option>
        <option value="sensorial">Sensorial</option>
      </select>
    </div>
    <div class="flex gap-3 mt-2">
      <button type="button" (click)="cerrarModal()" class="flex-1 py-3 text-[#592014] font-bold hover:bg-[#E5D1CD]/40 rounded-xl transition-colors">
        Cancelar
      </button>
      <button type="submit" class="flex-1 py-3 bg-[#A64E2E] text-white font-bold rounded-xl hover:bg-[#8A3F2B] active:scale-95 transition-all">
        Guardar
      </button>
    </div>
  </form>
</div>
