<div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md mx-4 relative">
  <h2 class="text-2xl font-bold text-gray-700 mb-6">Añadir Paciente</h2>

  <form [formGroup]="pacienteForm" (ngSubmit)="onGuardar()">
    <div class="mb-4">
      <label class="block text-gray-700 mb-2">Nombre</label>
      <input type="text" formControlName="nombre" 
             class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-[#333333] focus:outline-none">
    </div>

    <div class="mb-4">
      <label class="block text-gray-700 mb-2">Apellidos</label>
      <input type="text" formControlName="apellidos" 
             class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-[#333333] focus:outline-none">
    </div>

    <div class="mb-4">
      <label class="block text-gray-700 mb-2">Nivel de riesgo</label>
      <select formControlName="riesgo" class="w-full border border-gray-300 rounded-md p-2 bg-white">
        <option value="">Seleccione...</option>
        <option value="bajo">Bajo</option>
        <option value="medio">Medio</option>
        <option value="alto">Alto</option>
      </select>
    </div>

    <div class="mb-8">
      <label class="block text-gray-700 mb-2">Discapacidad (Opcional)</label>
      <select formControlName="discapacidad" class="w-full border border-gray-300 rounded-md p-2 bg-white">
        <option value="">Ninguna</option>
        <option value="fisica">Física</option>
        <option value="intelectual">Intelectual</option>
        <option value="sensorial">Sensorial</option>
      </select>
    </div>

    <div class="flex justify-end gap-4">
      <button type="button" (click)="onCancelar()" 
              class="px-6 py-2 text-gray-600 font-medium hover:bg-gray-100 rounded-md transition-colors">
        Cancelar
      </button>
      <button type="submit" 
              class="bg-[#333333] text-white px-6 py-2 rounded-md hover:bg-black transition-colors">
        Guardar
      </button>
    </div>
  </form>
</div>
