<div class="bg-white rounded-[2rem] p-10 w-full h-full border border-[#A64E2E] flex flex-col relative shadow-sm">
  
  <div class="flex justify-between items-center mb-8 shrink-0">
    <div class="flex items-center gap-4">
      <h3 class="text-[#592014] font-bold text-2xl">Recomendaciones Clínicas</h3>
      <span class="bg-[#E5D1CD] text-[#592014] px-4 py-1.5 rounded-full text-sm font-bold">
        {{ recomendaciones().length }} activas
      </span>
    </div>
    
    <button (click)="abrirModal()" class="bg-[#A64E2E] text-white px-6 py-3 rounded-lg text-base font-bold hover:bg-[#8A3F2B] transition-colors shadow-sm">
      + Añadir recomendación
    </button>
  </div>

  <div class="flex flex-row flex-nowrap gap-6 overflow-x-auto pb-6 snap-x custom-scrollbar w-full flex-1 min-h-0 items-stretch">
    @for (rec of recomendaciones(); track rec.id) {
      <div class="min-w-[360px] w-[360px] h-full shrink-0 bg-white border border-[#A64E2E] rounded-2xl p-6 shadow-sm snap-start flex flex-col gap-4 hover:shadow-md transition-shadow">
        
        <div class="flex items-start gap-4 shrink-0 w-full">
          <div class="bg-[#E5D1CD] text-[#592014] p-3 rounded-xl shrink-0 mt-1">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          </div>
          <h4 class="text-[#592014] font-bold text-lg leading-tight flex-1 min-w-0 break-words mt-1">
            {{ rec.titulo }}
          </h4>
        </div>

        <div class="text-[#592014]/80 text-base leading-relaxed whitespace-pre-wrap break-words mt-2 flex-1 min-h-0 overflow-y-auto custom-scrollbar pr-2 font-medium">
          {{ rec.contenido }}
        </div>

      </div>
    } @empty {
      <div class="w-full h-full flex flex-col items-center justify-center py-12 text-[#A64E2E]/60 gap-4 border-2 border-dashed border-[#A64E2E]/30 rounded-2xl">
        <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <p class="text-lg font-medium">No hay recomendaciones registradas.</p>
      </div>
    }
  </div>

  @if (showModal()) {
    <div class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
      <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm mx-4 relative border border-[#A64E2E]">
        <h2 class="text-2xl font-bold text-[#592014] mb-6">Añadir Recomendación</h2>

        <form [formGroup]="recomendacionForm" (ngSubmit)="onGuardar()" class="flex flex-col gap-5">
          <div>
            <label class="block text-[#A64E2E] font-bold mb-2 text-sm">Título</label>
            <input type="text" formControlName="titulo" 
                   class="w-full bg-gray-50 border border-[#A64E2E]/50 rounded-xl p-3 text-base text-[#592014] focus:border-[#A64E2E] focus:ring-2 focus:ring-[#E5D1CD] focus:outline-none transition-all">
          </div>

          <div>
            <label class="block text-[#A64E2E] font-bold mb-2 text-sm">Contenido</label>
            <textarea formControlName="contenido" rows="5"
                      class="w-full bg-gray-50 border border-[#A64E2E]/50 rounded-xl p-3 text-base text-[#592014] focus:border-[#A64E2E] focus:ring-2 focus:ring-[#E5D1CD] focus:outline-none resize-none transition-all"></textarea>
          </div>

          <div class="flex gap-3 mt-2">
            <button type="button" (click)="cerrarModal()" 
                    class="flex-1 py-3 text-[#592014] font-bold hover:bg-[#E5D1CD]/40 rounded-xl transition-colors">
              Cancelar
            </button>
            <button type="submit" 
                    class="flex-1 py-3 bg-[#A64E2E] text-white font-bold rounded-xl hover:bg-[#8A3F2B] active:scale-95 transition-all">
              Guardar
            </button>
          </div>
        </form>
      </div>
    </div>
  }
</div>
