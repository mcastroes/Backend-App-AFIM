<div class="bg-white rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.12)] p-10 w-full h-[75vh] border border-gray-50 flex flex-col relative">
  
  <div class="flex justify-between items-center mb-8 shrink-0">
    <div class="flex items-center gap-4">
      <h3 class="text-gray-800 font-bold text-2xl">Recomendaciones Clínicas</h3>
      <span class="bg-gray-100 text-[#333333] px-4 py-1.5 rounded-full text-sm font-bold">
        {{ recomendaciones().length }} activas
      </span>
    </div>
    
    <button (click)="abrirFormulario()" class="bg-[#333333] text-white px-6 py-3 rounded-lg text-base font-medium hover:bg-black transition-colors shadow-sm">
      + Añadir recomendación
    </button>
  </div>

  <div class="flex flex-row flex-nowrap gap-6 overflow-x-auto pb-6 snap-x custom-scrollbar w-full flex-1 min-h-0 items-stretch">
    @for (rec of recomendaciones(); track rec.id) {
      <div class="min-w-[360px] w-[360px] h-full shrink-0 bg-gradient-to-br from-gray-50 to-white border border-gray-200 rounded-2xl p-6 shadow-sm snap-start flex flex-col gap-4 hover:shadow-md transition-shadow">
        
        <div class="flex items-start gap-4 shrink-0 w-full">
          <div class="bg-gray-200 text-[#333333] p-3 rounded-xl shrink-0 mt-1">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          </div>
          <h4 class="text-gray-800 font-bold text-lg leading-tight flex-1 min-w-0 break-words mt-1">
            {{ rec.titulo }}
          </h4>
        </div>

        <div class="text-gray-600 text-base leading-relaxed whitespace-pre-wrap break-words mt-2 flex-1 min-h-0 overflow-y-auto custom-scrollbar pr-2">
          {{ rec.contenido }}
        </div>

      </div>
    } @empty {
      <div class="w-full h-full flex flex-col items-center justify-center py-12 text-gray-400 gap-4 border-2 border-dashed border-gray-200 rounded-2xl">
        <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <p class="text-lg">No hay recomendaciones registradas.</p>
      </div>
    }
  </div>

  @if (mostrandoFormulario()) {
    <div class="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4">
      <div class="bg-white p-10 rounded-2xl shadow-2xl w-full max-w-lg mx-4 relative">
        <h2 class="text-3xl font-bold text-gray-800 mb-8">Añadir Recomendación</h2>

        <form [formGroup]="recomendacionForm" (ngSubmit)="onGuardar()">
          <div class="mb-6">
            <label class="block text-gray-700 font-medium mb-2 text-lg">Título</label>
            <input type="text" formControlName="titulo" 
                   class="w-full border border-gray-300 rounded-lg p-3 text-lg focus:ring-2 focus:ring-[#333333] focus:outline-none">
          </div>

          <div class="mb-10">
            <label class="block text-gray-700 font-medium mb-2 text-lg">Contenido</label>
            <textarea formControlName="contenido" rows="6"
                      class="w-full border border-gray-300 rounded-lg p-3 text-lg focus:ring-2 focus:ring-[#333333] focus:outline-none resize-none"></textarea>
          </div>

          <div class="flex justify-end gap-4">
            <button type="button" (click)="cerrarFormulario()" 
                    class="px-8 py-3 text-gray-600 font-medium text-lg hover:bg-gray-100 rounded-lg transition-colors">
              Cancelar
            </button>
            <button type="submit" 
                    class="bg-[#333333] text-white px-8 py-3 rounded-lg text-lg hover:bg-black transition-colors">
              Guardar
            </button>
          </div>
        </form>
      </div>
    </div>
  }
</div>
