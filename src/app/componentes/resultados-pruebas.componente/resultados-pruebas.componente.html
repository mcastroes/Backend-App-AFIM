<div class="w-full bg-white border border-[#A64E2E] rounded-[1.5rem] shadow-sm overflow-hidden shrink-0">
    
    <div class="bg-[#E5D1CD]/30 px-5 py-3 border-b border-[#A64E2E]/30 flex justify-between items-center">
        <span class="text-[#592014] font-semibold tracking-wide text-base">
             {{ resultado.fechaFinalizacion | date:'dd/MM/yyyy · HH:mm' }}
        </span>
        <span class="text-[10px] font-bold uppercase tracking-widest text-[#A64E2E] bg-white px-2 py-0.5 rounded-full border border-[#A64E2E]/30">
            Completada
        </span>
    </div>

    <div class="p-4 flex flex-col gap-3">
        @for (item of resultado.respuestas; track item.idPregunta) {
            
            <div class="flex flex-col md:flex-row md:items-start gap-2 border-b border-[#E5D1CD]/50 pb-3 last:border-0 last:pb-0">
                
                <div class="md:w-1/3 mt-1 text-[#A64E2E] text-xs font-bold uppercase tracking-wider">
                    {{ formatearPregunta(item.idPregunta) }}
                </div>
                
                <div class="md:w-2/3 text-[#592014]">
                    @if (esImagen(item.valor)) {
                        <div class="mt-1 border border-[#A64E2E]/30 rounded-lg bg-white p-1 inline-block shadow-sm">
                            <img [src]="item.valor" alt="Dibujo del paciente" class="max-h-32 rounded object-contain">
                        </div>
                    } @else {
                        <p class="text-base font-medium bg-[#FFFCFC] border border-[#A64E2E]/20 rounded-lg p-2.5 shadow-sm leading-snug">
                            {{ item.valor }}
                        </p>
                    }
                </div>
            </div>

        }
    </div>
</div>
