<form [formGroup]="filtroForm" (ngSubmit)="onBuscar()" class="bg-white p-6 rounded-lg shadow-sm">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-gray-700">Filtros</h2>
    <button type="button" class="text-3xl font-light hover:text-gray-500">+</button>
  </div>

  <div class="mb-4">
    <label class="block text-gray-700 mb-2">Nombre</label>
    <input type="text" formControlName="nombre" placeholder="Escriba aquí el nombre" 
           class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-green-500">
    
    @if(esCampoValido('nombre')) {
      <span class="text-sm text-red-500 mt-1 block">
        {{ getErrorCampo('nombre') }}
      </span>
    }
  </div>

  <div class="mb-4">
    <label class="block text-gray-700 mb-2">Nivel de riesgo</label>
    <select formControlName="riesgo" class="w-full border border-gray-300 rounded-md p-2 bg-white">
      <option value="">Elija el nivel</option>
      <option value="bajo">Bajo</option>
      <option value="medio">Medio</option>
      <option value="alto">Alto</option>
    </select>
  </div>

  <div class="mb-4">
    <label class="block text-gray-700 mb-2">Tipo de discapacidad</label>
    <select formControlName="discapacidad" class="w-full border border-gray-300 rounded-md p-2 bg-white">
      <option value="">Elija la discapacidad</option>
      <option value="fisica">Física</option>
      <option value="intelectual">Intelectual</option>
      <option value="sensorial">Sensorial</option>
    </select>
  </div>

  <div class="mb-6">
    <label class="block text-gray-700 mb-2">Fecha de última actualización</label>
    <div class="flex gap-2">
      <input type="text" formControlName="dia" placeholder="DD" class="w-1/3 border border-gray-300 rounded-md p-2 text-center">
      <input type="text" formControlName="mes" placeholder="MM" class="w-1/3 border border-gray-300 rounded-md p-2 text-center">
      <input type="text" formControlName="anio" placeholder="YYYY" class="w-1/3 border border-gray-300 rounded-md p-2 text-center">
    </div>
  </div>

  <div class="flex justify-end">
    <button type="submit" class="bg-[#333333] text-white px-8 py-2 rounded-md hover:bg-black transition-colors">
      Buscar
    </button>
  </div>
</form>
