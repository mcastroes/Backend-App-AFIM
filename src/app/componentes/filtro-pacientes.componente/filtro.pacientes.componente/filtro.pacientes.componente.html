<form [formGroup]="filtroForm" (ngSubmit)="onBuscar()" class="flex flex-col gap-4 h-full bg-[#EAE4E0]">
  <div>
    <label class="block text-[#A64E2E] font-bold text-sm mb-1">Nombre</label>
    <input type="text" formControlName="nombre" placeholder="Escriba aquí el nombre" 
           class="w-full bg-white border border-[#A64E2E] rounded-xl p-3 text-[#592014] focus:outline-none focus:ring-2 focus:ring-[#E5D1CD] placeholder:text-gray-400">
    @if (esCampoValido('nombre')) {
      <span class="text-red-500 text-xs mt-1 font-medium block">{{ getErrorCampo('nombre') }}</span>
    }
  </div>

  <div>
    <label class="block text-[#A64E2E] font-bold text-sm mb-1">Nivel de riesgo</label>
    <select formControlName="riesgo" class="w-full bg-white border border-[#A64E2E] rounded-xl p-3 text-[#592014] focus:outline-none focus:ring-2 focus:ring-[#E5D1CD] appearance-none">
      <option value="">Elija el nivel</option>
      <option value="bajo">Bajo</option>
      <option value="medio">Medio</option>
      <option value="alto">Alto</option>
    </select>
  </div>

  <div>
    <label class="block text-[#A64E2E] font-bold text-sm mb-1">Tipo de discapacidad</label>
    <select formControlName="discapacidad" class="w-full bg-white border border-[#A64E2E] rounded-xl p-3 text-[#592014] focus:outline-none focus:ring-2 focus:ring-[#E5D1CD] appearance-none">
      <option value="">Elija la discapacidad</option>
      <option value="fisica">Física</option>
      <option value="intelectual">Intelectual</option>
      <option value="sensorial">Sensorial</option>
    </select>
  </div>

  <div>
    <label class="block text-[#A64E2E] font-bold text-sm mb-1">Fecha de última actualización</label>
    <div class="flex gap-2 sm:gap-3">
      <input type="text" formControlName="dia" placeholder="DD" class="w-1/3 bg-white border border-[#A64E2E] rounded-xl p-3 text-center text-[#592014] placeholder:text-gray-400 focus:outline-none">
      <input type="text" formControlName="mes" placeholder="MM" class="w-1/3 bg-white border border-[#A64E2E] rounded-xl p-3 text-center text-[#592014] placeholder:text-gray-400 focus:outline-none">
      <input type="text" formControlName="anio" placeholder="YYYY" class="w-1/3 bg-white border border-[#A64E2E] rounded-xl p-3 text-center text-[#592014] placeholder:text-gray-400 focus:outline-none">
    </div>
  </div>

  <button type="submit" class="w-full mt-2 bg-[#A64E2E] text-white font-bold text-base py-3 rounded-xl hover:bg-[#8A3F2B] transition-colors">
    Buscar
  </button>
</form>
