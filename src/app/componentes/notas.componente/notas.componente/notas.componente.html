<div class="bg-white rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.12)] p-6 w-full h-full border border-gray-50 flex flex-col">
  <div class="flex justify-between items-center mb-4 shrink-0">
    <h3 class="text-gray-500 font-medium text-sm">Notas</h3>
    <button (click)="onAgregarNota()" class="text-2xl font-bold text-gray-800 hover:scale-110 transition-transform">+</button>
  </div>

  <div class="flex flex-col gap-3 overflow-y-auto pr-2 custom-scrollbar flex-1 min-h-0">
    @for (nota of notas(); track nota.id) {
      <div class="border border-gray-200 rounded-lg p-3 text-sm text-gray-600 font-medium bg-white shadow-sm shrink-0">
        {{ nota.contenido }}
      </div>
    } @empty {
      <p class="text-sm text-gray-400 italic">No hay notas registradas.</p>
    }
  </div>
</div>
