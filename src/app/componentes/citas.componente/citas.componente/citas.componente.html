<div class="bg-white rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.12)] p-6 w-full h-full border border-gray-50 flex flex-col">
  <div class="flex justify-between items-center mb-6 shrink-0">
    <h3 class="text-gray-800 font-bold text-lg">Historial de Citas</h3>
    <span class="bg-gray-100 text-gray-600 px-3 py-1 rounded-full text-xs font-bold">{{ citas().length }} citas</span>
  </div>

  <div class="flex flex-col gap-4 overflow-y-auto pr-2 custom-scrollbar flex-1 min-h-0">
    @for (cita of citas(); track cita.id) {
      <div class="border border-gray-100 rounded-xl p-5 bg-white shadow-sm hover:shadow-md transition-shadow shrink-0 flex flex-col gap-3">
        
        <div class="flex justify-between items-center">
          <div class="flex flex-col gap-1">
            <span class="text-gray-800 font-bold text-base">{{ cita.fecha || 'Día ' + cita.dia }}</span>
            <span class="text-gray-500 font-medium text-sm flex items-center gap-1">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
              {{ cita.hora }}
            </span>
          </div>
          
          <span class="text-[10px] uppercase font-bold tracking-wider px-3 py-1 rounded-md"
                [class.bg-yellow-100]="cita.estado === 'pendiente'"
                [class.text-yellow-700]="cita.estado === 'pendiente'"
                [class.bg-green-100]="cita.estado === 'completada'"
                [class.text-green-700]="cita.estado === 'completada'"
                [class.bg-red-100]="cita.estado === 'cancelada'"
                [class.text-red-700]="cita.estado === 'cancelada'">
            {{ cita.estado }}
          </span>
        </div>

        @if (cita.estado === 'pendiente') {
          <div class="flex gap-3 mt-3 border-t border-gray-50 pt-4">
            <button (click)="estadoCambiado.emit({id: cita.id, nuevoEstado: 'completada'})" 
                    class="flex-1 bg-green-50 text-green-700 border border-green-200 rounded-lg py-2 text-xs font-bold hover:bg-green-100 transition-colors">
              Completar
            </button>
            <button (click)="estadoCambiado.emit({id: cita.id, nuevoEstado: 'cancelada'})" 
                    class="flex-1 bg-red-50 text-red-700 border border-red-200 rounded-lg py-2 text-xs font-bold hover:bg-red-100 transition-colors">
              Cancelar
            </button>
          </div>
        }
      </div>
    } @empty {
      <div class="flex flex-col items-center justify-center h-full text-gray-400 gap-2">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        <p class="text-sm italic">Este paciente no tiene citas registradas.</p>
      </div>
    }
  </div>
</div>
