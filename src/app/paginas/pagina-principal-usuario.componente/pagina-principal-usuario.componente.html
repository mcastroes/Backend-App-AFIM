<!-- Contenedor Raíz: min-h-screen asegura que el fondo blanco cubra toda la pantalla -->
<div class="min-h-screen w-full bg-white text-[#592014] font-sans flex flex-col">

    <!-- CABECERA (Header): Contiene navegación, identidad del usuario y ajustes -->
    <header class="h-20 w-full flex items-center justify-between px-8 border-b border-gray-100 bg-white shadow-sm shrink-0">
        
        <div class="flex items-center gap-6">
            <!-- Botón Volver: Implementa navegación hacia atrás mediante el router -->
            <button (click)="volver()" class="flex items-center justify-center w-12 h-12 text-[#592014] hover:bg-[#A64E2E]/10 rounded-full transition-all active:scale-90" aria-label="Volver">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5"/>
                    <path d="M12 19l-7-7 7-7"/>
                </svg>
            </button>

            <!-- Avatar y Nombre: Uso de Signals para mostrar el nombre del paciente en tiempo real -->
            <div class="flex items-center gap-4">
                <!-- Avatar generado dinámicamente con la inicial del nombre -->
                <div class="w-10 h-10 bg-[#e0d6ff] rounded-full flex items-center justify-center text-[#4b0082] font-bold shadow-sm">
                    {{ nombreUsuario().charAt(0) }}
                </div>
                <span class="text-xl font-medium">{{ nombreUsuario() }}</span>
            </div>
        </div>

        <!-- Botón Configuración: Acceso a ajustes de perfil o accesibilidad -->
        <button (click)="abrirConfiguracion()" class="flex items-center justify-center w-12 h-12 text-[#592014] hover:bg-[#A64E2E]/10 rounded-full transition-all active:scale-90" aria-label="Configuración">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z"/>
            </svg>
        </button>
        
    </header>

    <!-- CONTENIDO PRINCIPAL (Main): Menú de tarjetas de gran tamaño -->
    <main class="flex-1 flex flex-wrap justify-center items-center gap-10 p-8">

        <!-- Tarjeta Cuestionarios: Botón de gran tamaño para facilitar la interacción táctil -->
        <button (click)="irACuestionarios()" 
            class="w-full max-w-md h-96 bg-[#FFFCFC] border border-[#A64E2E] rounded-xl shadow-sm flex items-center justify-center text-3xl font-semibold text-[#592014] transition-all duration-300 hover:scale-[1.02] hover:shadow-md hover:bg-white focus:outline-none focus:ring-4 focus:ring-[#E5D1CD]">
            Cuestionarios
        </button>

        <!-- Tarjeta Pruebas: Acceso directo a la batería de tests biométricos -->
        <button (click)="irAPruebas()" 
            class="w-full max-w-md h-96 bg-[#FFFCFC] border border-[#A64E2E] rounded-xl shadow-sm flex items-center justify-center text-3xl font-semibold text-[#592014] transition-all duration-300 hover:scale-[1.02] hover:shadow-md hover:bg-white focus:outline-none focus:ring-4 focus:ring-[#E5D1CD]">
            Pruebas
        </button>

    </main>

</div>
