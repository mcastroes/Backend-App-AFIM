<div class="max-w-6xl mx-auto p-6 min-h-screen bg-[#FAFAFA]">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-12 mt-8">
    
    <div>
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-gray-500">Personas-Usuarias registradas</h2>
        <button (click)="irACrearPaciente()" class="text-3xl font-light text-gray-500 hover:text-gray-800 transition-colors" title="Añadir usuario">+</button>
      </div>
      
      <app-lista-pacientes 
        [pacientes]="pacientesFiltrados()"
        (seleccionarPaciente)="abrirPerfilPaciente($event)">
      </app-lista-pacientes>
    </div>

    <div>
      <app-filtro-pacientes 
        (buscar)="aplicarFiltros($event)">
      </app-filtro-pacientes>
    </div>

  </div>
</div>
