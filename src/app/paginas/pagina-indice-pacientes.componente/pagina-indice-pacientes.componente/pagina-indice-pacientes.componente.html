<div class="max-w-6xl mx-auto p-6 min-h-screen bg-[#FAFAFA]">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-12 mt-8">
    
    <div>
      <h2 class="text-2xl font-bold text-gray-500 mb-6">Personas-Usuarias registradas</h2>
      
      <div class="max-h-[600px] overflow-y-auto pr-4">
        @for (paciente of pacientesFiltrados; track paciente.id) {
          <div class="bg-white border border-gray-300 rounded-md py-3 px-4 mb-3 text-center font-medium text-gray-800 hover:border-gray-400 cursor-pointer transition-colors shadow-sm">
            {{ paciente.nombre }} {{ paciente.apellidos }}
          </div>
        } 
        @empty {
          <div class="text-center p-8 text-gray-400 italic bg-white border border-dashed border-gray-300 rounded-md">
            No se han encontrado pacientes con esos filtros.
          </div>
        }
      </div>
    </div>

    <div>
      <app-filtro-pacientes (buscar)="aplicarFiltros($event)"></app-filtro-pacientes>
    </div>

  </div>
</div>
