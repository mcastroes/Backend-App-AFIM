<div class="h-screen w-full bg-[#EAE4E0] flex flex-col font-sans overflow-hidden">
  
  <header class="h-20 w-full flex items-center justify-between px-8 shrink-0 relative z-20">
    <div class="flex items-center gap-4">
      <button (click)="volver()" class="text-[#592014] hover:bg-[#A64E2E]/10 p-2 rounded-full transition-all">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      </button>
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-[#E5D1CD] rounded-full flex items-center justify-center text-[#592014] shadow-sm">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <span class="text-[#592014] font-bold text-lg">Profesional</span>
      </div>
    </div>
  </header>

  <main class="flex-1 flex flex-row gap-8 p-8 overflow-hidden">
    <div class="w-1/2 flex flex-col gap-6 h-full">
      <button (click)="irAGestionUsuarios()" 
        class="flex-1 bg-white border border-[#A64E2E] rounded-2xl text-[#592014] text-xl font-medium hover:bg-[#E5D1CD]/20 transition-all shadow-sm flex items-center justify-center px-8">
        Gestión de Pacientes
      </button>
      
      <button (click)="irAGestionProfesionales()" 
        class="flex-1 bg-white border border-[#A64E2E] rounded-2xl text-[#592014] text-xl font-medium hover:bg-[#E5D1CD]/20 transition-all shadow-sm flex items-center justify-center px-8">
        Pacientes en Seguimiento
      </button>
      
      <button (click)="irAEstadisticas()" 
        class="flex-1 bg-white border border-[#A64E2E] rounded-2xl text-[#592014] text-xl font-medium hover:bg-[#E5D1CD]/20 transition-all shadow-sm flex items-center justify-center px-8">
        Consultas Pasadas
      </button>
    </div>

    <div class="w-1/2 h-full flex flex-col gap-6 overflow-y-auto custom-scrollbar pr-2">
      <app-calendario 
        class="w-full shrink-0"
        [listaPacientes]="listaPacientes()"
        [citasDelDia]="citasDelDia()"
        [diasConCitas]="diasConCitas()"
        (diaSeleccionado)="procesarDiaSeleccionado($event)"
        (nuevaCita)="procesarNuevaCita($event)">
      </app-calendario>
    </div>
  </main>
</div>
