@if (paciente(); as p) {
  <div class="min-h-screen bg-[#EAE4E0] font-sans flex flex-col p-8">
    
    <header class="flex items-center justify-between mb-8 shrink-0">
      <div class="flex items-center gap-6">
        <button (click)="volver()" class="text-[#592014] hover:bg-[#A64E2E]/10 p-2 rounded-full transition-all">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"/>
            <path d="M12 19l-7-7 7-7"/>
          </svg>
        </button>
        <h1 class="text-3xl font-bold text-[#592014]">Usuario: {{ p.nombre }} {{ p.apellidos }}</h1>
      </div>
      
      <div class="flex items-center gap-4">
        <button class="bg-[#E5D1CD] border border-[#A64E2E] rounded-xl px-5 py-2 font-bold text-[#592014] flex items-center gap-2 hover:bg-[#D9C0BA] transition-colors shadow-sm">
          <span class="text-xl">+</span> Informe
        </button>
        <button class="w-10 h-10 border border-[#A64E2E] rounded-full flex items-center justify-center font-bold text-[#A64E2E] hover:bg-[#E5D1CD] transition-colors shadow-sm">
          i
        </button>
      </div>
    </header>

    <main class="flex-1 flex gap-10">
      
      <div class="w-3/5 flex flex-col bg-white border border-[#A64E2E] rounded-[2rem] p-6 shadow-sm">
        <app-grafico class="block w-full flex-1 min-h-[400px]"></app-grafico>
      </div>

      <div class="w-2/5 flex flex-col gap-6">
        
        <button (click)="irADatos(p.id)" class="w-full bg-white border border-[#A64E2E] rounded-2xl py-6 px-4 text-[#592014] text-lg font-medium hover:bg-[#E5D1CD]/20 transition-all shadow-sm">
          Datos del Paciente
        </button>
        
        <button (click)="irARecomendaciones(p.id)" class="w-full bg-white border border-[#A64E2E] rounded-2xl py-6 px-4 text-[#592014] text-lg font-medium hover:bg-[#E5D1CD]/20 transition-all shadow-sm">
          Recomendaciones Clínicas
        </button>
        
        <button (click)="irAResultadosPruebas(p.id)" class="w-full bg-white border border-[#A64E2E] rounded-2xl py-6 px-4 text-[#592014] text-lg font-medium hover:bg-[#E5D1CD]/20 transition-all shadow-sm">
          Cuestionarios y Pruebas
        </button>

        <div class="w-full flex-1 min-h-[200px] mt-4 relative">
          <app-notas 
            class="absolute inset-0 block h-full"
            [notas]="notasDelPaciente()" 
            (nuevaNota)="procesarNuevaNota()">
          </app-notas>
        </div>
        
      </div>
    </main>

  </div>
} @else {
  <div class="min-h-screen bg-[#EAE4E0] font-sans flex items-center justify-center p-8">
    <div class="flex flex-col items-center gap-4 text-[#A64E2E]">
      <svg class="animate-spin h-10 w-10" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <p class="text-xl font-medium animate-pulse">Cargando perfil del paciente...</p>
    </div>
  </div>
}
