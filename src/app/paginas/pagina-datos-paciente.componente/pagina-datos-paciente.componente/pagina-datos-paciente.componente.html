@if (paciente(); as p) {
  <div class="min-h-screen bg-[#EAE4E0] font-sans flex flex-col p-8">
    <header class="flex items-center justify-between mb-8 shrink-0">
      <div class="flex items-center gap-6">
        <button (click)="volver()" class="text-[#592014] hover:bg-[#A64E2E]/10 p-2 rounded-full transition-all">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        </button>
        <h1 class="text-3xl font-bold text-[#592014]">Datos de: {{ p.nombre }} {{ p.apellidos }}</h1>
      </div>
    </header>

    <main class="flex-1 flex items-stretch gap-10">
      <div class="w-1/2 flex flex-col">
        <app-caracteristicas-paciente class="block h-full" [paciente]="p"></app-caracteristicas-paciente>
      </div>

      <div class="w-1/2 flex flex-col relative min-h-[500px]">
        <app-citas 
          class="absolute inset-0 block h-full"
          [citas]="p.citas"
          (estadoCambiado)="actualizarEstadoCita($event)">
        </app-citas>
      </div>
    </main>
  </div>
}
